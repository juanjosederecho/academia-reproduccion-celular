<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Arial, sans-serif">
<rect width="1000" height="470" rx="24" fill="#fbf7ff"/>
<text x="500" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#6a1b9a">PROFASE I: "Los Cuyes Pequeños Duermen Diario"</text>
<g font-weight="bold" text-anchor="middle">
<!-- each panel 190 wide -->
<g transform="translate(105,200)"><circle r="85" fill="#fff" stroke="#9575cd" stroke-width="4" stroke-dasharray="8 5"/>
