<path d="M-40 50 C-10 20 -40 -10 10 -30 S 40 -60 55 -20" stroke="#e53935" stroke-width="4" fill="none"/>
<text y="130" font-size="30" fill="#1565c0">L</text><text y="160" font-size="22" fill="#333">Leptoteno</text><text y="188" font-size="17" fill="#555" font-weight="normal">hilos delgados</text></g>
<g transform="translate(300,200)"><circle r="85" fill="#fff" stroke="#9575cd" stroke-width="4" stroke-dasharray="8 5"/>
