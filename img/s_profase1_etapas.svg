<path d="M-30 -55 C5 -30 -5 10 8 55" stroke="#e53935" stroke-width="7" fill="none"/>
<g stroke="#43a047" stroke-width="3"><line x1="-17" y1="5" x2="-6" y2="5"/><line x1="-12" y1="25" x2="0" y2="25"/><line x1="-8" y1="45" x2="4" y2="45"/></g>
<text y="130" font-size="30" fill="#1565c0">C</text><text y="160" font-size="22" fill="#333">Cigoteno</text><text y="188" font-size="17" fill="#555" font-weight="normal">apareamiento (sinapsis)</text></g>
<g transform="translate(500,200)"><circle r="85" fill="#fff" stroke="#9575cd" stroke-width="4" stroke-dasharray="8 5"/>
<rect x="-26" y="-60" width="12" height="120" rx="6" fill="#1e88e5"/><rect x="-13" y="-60" width="12" height="120" rx="6" fill="#1e88e5"/>
<rect x="2" y="-60" width="12" height="120" rx="6" fill="#e53935"/><rect x="15" y="-60" width="12" height="120" rx="6" fill="#e53935"/>
<rect x="-13" y="15" width="12" height="45" rx="6" fill="#e53935"/><rect x="2" y="15" width="12" height="45" rx="6" fill="#1e88e5"/>
<text x="55" y="20" font-size="30">⇄</text>
<text y="130" font-size="30" fill="#1565c0">P</text><text y="160" font-size="22" fill="#333">Paquiteno</text><text y="188" font-size="17" fill="#555" font-weight="normal">crossing over</text></g>
<g transform="translate(700,200)"><circle r="85" fill="#fff" stroke="#9575cd" stroke-width="4" stroke-dasharray="8 5"/>
<path d="M-40 -60 Q-2 -30 -8 0 Q-2 30 -40 60" stroke="#1e88e5" stroke-width="12" fill="none"/>
<path d="M40 -60 Q2 -30 8 0 Q2 30 40 60" stroke="#e53935" stroke-width="12" fill="none"/>
<circle cx="0" cy="0" r="14" fill="none" stroke="#ff9800" stroke-width="4"/>
<text x="0" y="-22" font-size="16" fill="#e65100">quiasma</text>
<text y="130" font-size="30" fill="#1565c0">D</text><text y="160" font-size="22" fill="#333">Diploteno</text><text y="188" font-size="17" fill="#555" font-weight="normal">quiasmas visibles</text></g>
<g transform="translate(895,200)"><circle r="85" fill="#fff" stroke="#ddd" stroke-width="2" stroke-dasharray="3 9"/>
