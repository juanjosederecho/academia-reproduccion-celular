<circle cx="130" cy="108" r="18"/><circle cx="130" cy="140" r="18"/>
<circle cx="205" cy="100" r="15"/><circle cx="235" cy="100" r="15"/><circle cx="205" cy="130" r="15"/><circle cx="235" cy="130" r="15"/>
