<g transform="translate(170,-30)"><circle cx="45" cy="40" r="24" fill="#ffd6a5"/><rect x="25" y="64" width="40" height="100" rx="12" fill="#43aa8b"/><rect x="27" y="164" width="14" height="70" fill="#577590"/><rect x="49" y="164" width="14" height="70" fill="#577590"/>
<text x="45" y="245" text-anchor="middle" font-size="22" fill="#333">Joven</text></g>
